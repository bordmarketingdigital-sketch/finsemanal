<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1923">
<meta name="description" content="Controle financeiro semanal - Contas a Pagar e Receber">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinSemanal">
<link rel="manifest" href="manifest.json">
<title>FinSemanal — Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1118;
    --surface: #121c27;
    --surface2: #1a2535;
    --border: #1f3048;
    --accent-pay: #ff4d6d;
    --accent-recv: #00e5a0;
    --accent-neutral: #3d9eff;
    --text: #e8edf3;
    --text-muted: #5e7a96;
    --text-dim: #3a5268;
    --green: #00e5a0;
    --red: #ff4d6d;
    --yellow: #ffd166;
    --week-active: #1e3a5f;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11,17,24,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo span { color: var(--accent-recv); }

  .header-actions { display: flex; gap: 8px; }

  /* MAIN LAYOUT */
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 100px; }

  /* YEAR/WEEK SELECTOR */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .year-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
  }

  .year-selector button {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 1.1rem; padding: 0 4px;
    transition: color .2s;
  }
  .year-selector button:hover { color: var(--text); }
  .year-selector .year-label {
    font-weight: 700; font-size: 1rem;
    font-family: var(--font-mono);
    min-width: 44px; text-align: center;
  }

  .week-jump {
    display: flex; gap: 6px; align-items: center;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .week-jump::-webkit-scrollbar { display: none; }

  .week-chip {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: .75rem;
    font-family: var(--font-mono);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
    color: var(--text-muted);
  }
  .week-chip:hover { border-color: var(--accent-neutral); color: var(--text); }
  .week-chip.active {
    background: var(--accent-neutral);
    border-color: var(--accent-neutral);
    color: #000;
    font-weight: 700;
  }
  .week-chip.current-week {
    border-color: var(--accent-recv);
    color: var(--accent-recv);
  }
  .week-chip.current-week.active {
    background: var(--accent-recv);
    color: #000;
    border-color: var(--accent-recv);
  }

  /* SUMMARY CARDS */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  @media (max-width: 600px) { .summary-grid { grid-template-columns: 1fr; } }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    position: relative;
    overflow: hidden;
  }

  .summary-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
  }
  .summary-card.card-pay::before { background: var(--red); }
  .summary-card.card-recv::before { background: var(--green); }
  .summary-card.card-balance::before { background: var(--accent-neutral); }

  .summary-card .label {
    font-size: .72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 6px;
    font-family: var(--font-mono);
  }
  .summary-card .amount {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    font-weight: 700;
  }
  .summary-card.card-pay .amount { color: var(--red); }
  .summary-card.card-recv .amount { color: var(--green); }
  .summary-card.card-balance .amount { color: var(--accent-neutral); }
  .summary-card .sub {
    font-size: .7rem; color: var(--text-dim);
    margin-top: 4px; font-family: var(--font-mono);
  }

  /* WEEK BLOCK */
  .week-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .week-block.active-week { border-color: var(--accent-neutral); }

  .week-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
    gap: 12px;
  }
  .week-header:hover { background: var(--surface2); }

  .week-title {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: .95rem;
    font-family: var(--font-mono);
  }
  .week-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: .7rem;
    color: var(--text-muted);
  }
  .week-badge.current { background: rgba(61,158,255,.15); border-color: var(--accent-neutral); color: var(--accent-neutral); }

  .week-amounts {
    display: flex; gap: 16px; align-items: center;
    font-family: var(--font-mono); font-size: .82rem;
  }
  .w-pay { color: var(--red); }
  .w-recv { color: var(--green); }
  .w-bal { color: var(--text-muted); }
  .w-bal.pos { color: var(--green); }
  .w-bal.neg { color: var(--red); }

  .week-chevron {
    color: var(--text-dim); font-size: .8rem;
    transition: transform .2s;
  }
  .week-block.open .week-chevron { transform: rotate(180deg); }

  .week-body {
    display: none;
    border-top: 1px solid var(--border);
  }
  .week-block.open .week-body { display: block; }

  /* TABS inside week */
  .week-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
  }
  .week-tab {
    flex: 1; padding: 10px; text-align: center;
    font-size: .78rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: all .15s;
    color: var(--text-muted);
  }
  .week-tab.active.pay { border-color: var(--red); color: var(--red); }
  .week-tab.active.recv { border-color: var(--green); color: var(--green); }

  /* ENTRIES LIST */
  .entries-list { padding: 8px 0; }

  .entry-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(31,48,72,0.5);
    transition: background .15s;
    animation: fadeIn .2s ease;
  }
  .entry-item:hover { background: rgba(255,255,255,0.03); }
  .entry-item:last-child { border-bottom: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  .entry-check {
    width: 18px; height: 18px; border-radius: 4px;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .entry-check.checked { background: var(--green); border-color: var(--green); }
  .entry-check.checked::after { content: '✓'; color: #000; font-size: .7rem; font-weight: 700; }
  .entry-check.pay-check.checked { background: var(--red); border-color: var(--red); }

  .entry-info { flex: 1; min-width: 0; }
  .entry-desc {
    font-size: .88rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry-meta {
    font-size: .7rem; color: var(--text-muted);
    font-family: var(--font-mono);
    display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap;
  }
  .entry-due { }
  .entry-recur {
    background: rgba(61,158,255,.1);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--accent-neutral);
  }
  .entry-fixed {
    background: rgba(255,209,102,.1);
    border-radius: 4px;
    padding: 1px 5px;
    color: var(--yellow);
  }
  .entry-overdue { color: var(--red); }

  .entry-amount {
    font-family: var(--font-mono);
    font-size: .92rem; font-weight: 700;
    flex-shrink: 0;
  }
  .entry-amount.pay { color: var(--red); }
  .entry-amount.recv { color: var(--green); }

  .entry-actions { display: flex; gap: 4px; }
  .entry-btn {
    background: none; border: none;
    color: var(--text-dim); cursor: pointer;
    padding: 4px; border-radius: 4px;
    font-size: .85rem; transition: all .15s;
    line-height: 1;
  }
  .entry-btn:hover { color: var(--text); background: var(--surface2); }
  .entry-btn.del:hover { color: var(--red); }

  .empty-week {
    padding: 20px; text-align: center;
    color: var(--text-dim); font-size: .82rem;
    font-family: var(--font-mono);
  }

  /* WEEK ADD BUTTONS */
  .week-add-row {
    display: flex; gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
  }
  .add-btn {
    flex: 1; padding: 8px 12px;
    border: 1px dashed;
    border-radius: var(--radius-sm);
    background: none;
    cursor: pointer;
    font-size: .78rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .06em;
    transition: all .2s;
    font-family: var(--font-display);
  }
  .add-btn.pay {
    border-color: rgba(255,77,109,.3);
    color: var(--red);
  }
  .add-btn.pay:hover { background: rgba(255,77,109,.1); border-color: var(--red); }
  .add-btn.recv {
    border-color: rgba(0,229,160,.3);
    color: var(--green);
  }
  .add-btn.recv:hover { background: rgba(0,229,160,.1); border-color: var(--green); }

  /* FAB */
  .fab-container {
    position: fixed; bottom: 24px; right: 20px;
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 10px;
    z-index: 90;
  }
  .fab-mini {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    border: none; border-radius: 24px;
    font-size: .82rem; font-weight: 700;
    cursor: pointer; font-family: var(--font-display);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: transform .15s, box-shadow .15s;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: all .2s;
  }
  .fab-mini.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .fab-mini.pay { background: var(--red); color: #fff; }
  .fab-mini.recv { background: var(--green); color: #000; }
  .fab-mini:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }

  .fab {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent-neutral);
    border: none; cursor: pointer;
    font-size: 1.5rem; color: #000;
    box-shadow: 0 4px 20px rgba(61,158,255,.4);
    transition: all .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .fab:hover { transform: scale(1.1); }
  .fab.open { transform: rotate(45deg); background: var(--text-muted); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%; max-width: 480px;
    box-shadow: var(--shadow);
    animation: modalIn .25s ease;
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.95) translateY(16px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px 0;
  }
  .modal-title {
    font-weight: 800; font-size: 1.1rem;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-title .dot {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .modal-title .dot.pay { background: var(--red); }
  .modal-title .dot.recv { background: var(--green); }

  .modal-close {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 1.2rem; padding: 4px;
    border-radius: 4px; transition: color .15s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 20px 24px 24px; }

  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block; font-size: .75rem;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin-bottom: 6px;
    font-family: var(--font-mono);
  }
  .form-input, .form-select {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; color: var(--text);
    font-size: .9rem; font-family: var(--font-display);
    outline: none; transition: border-color .15s;
    -webkit-appearance: none;
  }
  .form-input:focus, .form-select:focus { border-color: var(--accent-neutral); }
  .form-select option { background: var(--surface2); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Toggle group */
  .toggle-group {
    display: flex; border: 1px solid var(--border);
    border-radius: var(--radius-sm); overflow: hidden;
  }
  .toggle-opt {
    flex: 1; padding: 9px; text-align: center;
    font-size: .8rem; font-weight: 600;
    cursor: pointer; transition: all .15s;
    color: var(--text-muted);
    border: none; background: none;
    font-family: var(--font-display);
  }
  .toggle-opt.active { background: var(--accent-neutral); color: #000; }
  .toggle-opt.active.pay-opt { background: var(--red); color: #fff; }
  .toggle-opt.active.recv-opt { background: var(--green); color: #000; }

  .recur-fields { margin-top: 12px; display: none; }
  .recur-fields.show { display: block; }

  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  .btn-submit {
    width: 100%; padding: 13px;
    border: none; border-radius: var(--radius-sm);
    font-size: .9rem; font-weight: 700;
    cursor: pointer; font-family: var(--font-display);
    text-transform: uppercase; letter-spacing: .06em;
    transition: all .15s;
    margin-top: 4px;
  }
  .btn-submit.pay { background: var(--red); color: #fff; }
  .btn-submit.pay:hover { filter: brightness(1.1); }
  .btn-submit.recv { background: var(--green); color: #000; }
  .btn-submit.recv:hover { filter: brightness(1.1); }

  /* FILTER BAR */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 20px; align-items: center;
  }
  .filter-label { font-size: .75rem; color: var(--text-muted); font-family: var(--font-mono); }
  .filter-chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-size: .75rem; cursor: pointer;
    transition: all .15s; color: var(--text-muted);
    font-family: var(--font-mono);
  }
  .filter-chip:hover { border-color: var(--accent-neutral); color: var(--text); }
  .filter-chip.active { background: var(--accent-neutral); border-color: var(--accent-neutral); color: #000; font-weight: 700; }

  .search-input {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px;
    color: var(--text); font-size: .8rem;
    outline: none; font-family: var(--font-display);
    transition: border-color .15s; flex: 1; min-width: 140px;
  }
  .search-input:focus { border-color: var(--accent-neutral); }
  .search-input::placeholder { color: var(--text-dim); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(16px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 24px; padding: 10px 20px;
    font-size: .82rem; color: var(--text);
    font-family: var(--font-mono);
    opacity: 0; transition: all .3s;
    pointer-events: none; z-index: 300;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .week-amounts { display: none; }
    .form-row, .form-row-3 { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: repeat(3, 1fr); }
    .summary-card .amount { font-size: 1.1rem; }
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* INSTALL BANNER */
  .install-banner {
    background: linear-gradient(135deg, rgba(61,158,255,.15), rgba(0,229,160,.1));
    border: 1px solid rgba(61,158,255,.3);
    border-radius: var(--radius);
    padding: 12px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    font-size: .82rem;
  }
  .install-banner.show { display: flex; }
  .install-banner button {
    background: var(--accent-neutral); color: #000;
    border: none; border-radius: 6px;
    padding: 6px 14px; font-size: .78rem; font-weight: 700;
    cursor: pointer; white-space: nowrap;
    font-family: var(--font-display);
  }
  .install-banner .ib-close {
    background: none; color: var(--text-muted);
    margin-left: auto;
  }
</style>
</head>
<body>

<header>
  <div class="logo">Fin<span>Semanal</span></div>
  <div class="header-actions">
    <div id="currentWeekInfo" style="font-size:.75rem;color:var(--text-muted);font-family:var(--font-mono);line-height:1.3;text-align:right;"></div>
  </div>
</header>

<main>
  <div class="install-banner" id="installBanner">
    <span>📱 Instale o app para acesso rápido</span>
    <button id="installBtn">Instalar</button>
    <button class="ib-close" id="closeBanner">✕</button>
  </div>

  <div class="nav-bar">
    <div class="year-selector">
      <button id="prevYear">‹</button>
      <span class="year-label" id="yearLabel">2026</span>
      <button id="nextYear">›</button>
    </div>
    <div class="week-jump" id="weekChips"></div>
  </div>

  <div class="summary-grid">
    <div class="summary-card card-pay">
      <div class="label">▼ A Pagar</div>
      <div class="amount" id="summaryPay">R$ 0,00</div>
      <div class="sub" id="summaryPayCount">0 contas</div>
    </div>
    <div class="summary-card card-recv">
      <div class="label">▲ A Receber</div>
      <div class="amount" id="summaryRecv">R$ 0,00</div>
      <div class="sub" id="summaryRecvCount">0 contas</div>
    </div>
    <div class="summary-card card-balance">
      <div class="label">= Saldo</div>
      <div class="amount" id="summaryBal">R$ 0,00</div>
      <div class="sub" id="summaryPeriod">semana atual</div>
    </div>
  </div>

  <div class="filter-bar">
    <span class="filter-label">Filtro:</span>
    <button class="filter-chip active" data-filter="all">Todos</button>
    <button class="filter-chip" data-filter="pay">Pagar</button>
    <button class="filter-chip" data-filter="recv">Receber</button>
    <button class="filter-chip" data-filter="pending">Pendentes</button>
    <button class="filter-chip" data-filter="overdue">Vencidos</button>
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar...">
  </div>

  <div id="weeksContainer"></div>
</main>

<!-- FAB -->
<div class="fab-container" id="fabContainer">
  <button class="fab-mini recv" id="fabRecv">▲ Nova Receita</button>
  <button class="fab-mini pay" id="fabPay">▼ Nova Despesa</button>
  <button class="fab" id="fabMain">+</button>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title">
        <span class="dot" id="modalDot"></span>
        <span id="modalTitle">Nova Conta</span>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <div class="toggle-group">
          <button class="toggle-opt pay-opt" id="typePayBtn" onclick="setType('pay')">▼ Despesa / A Pagar</button>
          <button class="toggle-opt recv-opt" id="typeRecvBtn" onclick="setType('recv')">▲ Receita / A Receber</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Descrição</label>
        <input type="text" class="form-input" id="fDesc" placeholder="Ex: Aluguel, Salário, Fornecedor...">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Valor (R$)</label>
          <input type="number" class="form-input" id="fValue" placeholder="0,00" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Vencimento</label>
          <input type="date" class="form-input" id="fDate">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Recorrência</label>
        <div class="toggle-group">
          <button class="toggle-opt active" id="recurNoneBtn" onclick="setRecur('none')">Único</button>
          <button class="toggle-opt" id="recurFixedBtn" onclick="setRecur('fixed')">Fixo</button>
          <button class="toggle-opt" id="recurRecurBtn" onclick="setRecur('recur')">Recorrente</button>
        </div>
      </div>

      <!-- FIXED fields -->
      <div class="recur-fields" id="fixedFields">
        <div class="form-group">
          <label class="form-label">Período</label>
          <div class="toggle-group">
            <button class="toggle-opt active" id="fixedMonthBtn" onclick="setFixedPeriod('monthly')">Mensal</button>
            <button class="toggle-opt" id="fixedWeekBtn" onclick="setFixedPeriod('weekly')">Semanal</button>
          </div>
        </div>
      </div>

      <!-- RECURRENT fields -->
      <div class="recur-fields" id="recurFields">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Qtd de Vezes</label>
            <input type="number" class="form-input" id="fRecurTimes" placeholder="Ex: 12" min="1" max="52">
          </div>
          <div class="form-group">
            <label class="form-label">Período</label>
            <div class="toggle-group" style="margin-top:0">
              <button class="toggle-opt active" id="recurMonthBtn" onclick="setRecurPeriod('monthly')">Mensal</button>
              <button class="toggle-opt" id="recurWeekBtn" onclick="setRecurPeriod('weekly')">Semanal</button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Semana de lançamento</label>
        <select class="form-select" id="fWeek"></select>
      </div>

      <div style="margin-top:20px">
        <button class="btn-submit" id="btnSubmit" onclick="submitEntry()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────
// ISO WEEK UTILITIES
// ─────────────────────────────────────────
function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const week1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function getISOYear(date) {
  const d = new Date(date);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  return d.getFullYear();
}

function getWeekStart(year, week) {
  const jan4 = new Date(year, 0, 4);
  const dayOfWeek = (jan4.getDay() + 6) % 7;
  const weekStart = new Date(jan4);
  weekStart.setDate(jan4.getDate() - dayOfWeek + (week - 1) * 7);
  return weekStart;
}

function getWeekEnd(year, week) {
  const start = getWeekStart(year, week);
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  return end;
}

function getWeeksInYear(year) {
  const dec28 = new Date(year, 11, 28);
  return getISOWeek(dec28);
}

function formatDate(d) {
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
}

function formatDateFull(d) {
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function parseDateStr(str) {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}

function toDateInput(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function addMonths(date, n) {
  const d = new Date(date);
  d.setMonth(d.getMonth() + n);
  return d;
}

function addWeeks(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n * 7);
  return d;
}

// ─────────────────────────────────────────
// APP STATE
// ─────────────────────────────────────────
const today = new Date();
const currentISOWeek = getISOWeek(today);
const currentISOYear = getISOYear(today);

let state = {
  year: currentISOYear,
  activeFilter: 'all',
  searchQuery: '',
  fabOpen: false,
  editingId: null,
  modalType: 'pay',
  recurType: 'none',
  fixedPeriod: 'monthly',
  recurPeriod: 'monthly',
  entries: []
};

// Load from localStorage
function loadState() {
  try {
    const saved = localStorage.getItem('finsemanal_entries');
    if (saved) state.entries = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('finsemanal_entries', JSON.stringify(state.entries));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2,5);
}

// ─────────────────────────────────────────
// ENTRY HELPERS
// ─────────────────────────────────────────
function getEntriesForWeek(year, week) {
  return state.entries.filter(e => e.isoYear === year && e.isoWeek === week);
}

function fmtBRL(val) {
  return 'R$ ' + Number(val).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function isOverdue(entry) {
  if (entry.paid) return false;
  const due = parseDateStr(entry.dueDate);
  if (!due) return false;
  return due < today;
}

// ─────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────
function render() {
  renderWeekChips();
  renderWeeks();
  renderSummary();
  updateWeekInfo();
}

function updateWeekInfo() {
  const start = getWeekStart(currentISOYear, currentISOWeek);
  const end = getWeekEnd(currentISOYear, currentISOWeek);
  document.getElementById('currentWeekInfo').innerHTML =
    `Semana ${currentISOWeek}<br>${formatDate(start)}–${formatDate(end)}`;
}

function renderWeekChips() {
  const container = document.getElementById('weekChips');
  const totalWeeks = getWeeksInYear(state.year);
  let html = '';
  for (let w = 1; w <= totalWeeks; w++) {
    const isCurrent = state.year === currentISOYear && w === currentISOWeek;
    const cls = [
      'week-chip',
      isCurrent ? 'current-week' : '',
      (state.year === currentISOYear && w === currentISOWeek) ? 'active' : ''
    ].join(' ');
    html += `<button class="${cls}" data-week="${w}" onclick="scrollToWeek(${w})">${w}</button>`;
  }
  container.innerHTML = html;
}

function renderSummary() {
  let totalPay = 0, totalRecv = 0, countPay = 0, countRecv = 0;
  const totalWeeks = getWeeksInYear(state.year);
  for (let w = 1; w <= totalWeeks; w++) {
    const entries = getFilteredEntries(state.year, w);
    entries.forEach(e => {
      if (e.type === 'pay') { totalPay += e.value; countPay++; }
      else { totalRecv += e.value; countRecv++; }
    });
  }
  const bal = totalRecv - totalPay;
  document.getElementById('summaryPay').textContent = fmtBRL(totalPay);
  document.getElementById('summaryRecv').textContent = fmtBRL(totalRecv);
  document.getElementById('summaryBal').textContent = fmtBRL(bal);
  document.getElementById('summaryBal').style.color = bal >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('summaryPayCount').textContent = `${countPay} conta${countPay !== 1 ? 's' : ''}`;
  document.getElementById('summaryRecvCount').textContent = `${countRecv} conta${countRecv !== 1 ? 's' : ''}`;
  document.getElementById('summaryPeriod').textContent = state.year === currentISOYear ? 'ano corrente' : `ano ${state.year}`;
}

function getFilteredEntries(year, week) {
  let entries = getEntriesForWeek(year, week);
  if (state.activeFilter === 'pay') entries = entries.filter(e => e.type === 'pay');
  else if (state.activeFilter === 'recv') entries = entries.filter(e => e.type === 'recv');
  else if (state.activeFilter === 'pending') entries = entries.filter(e => !e.paid);
  else if (state.activeFilter === 'overdue') entries = entries.filter(e => isOverdue(e));
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    entries = entries.filter(e => e.desc.toLowerCase().includes(q));
  }
  return entries;
}

function renderWeeks() {
  const container = document.getElementById('weeksContainer');
  const totalWeeks = getWeeksInYear(state.year);
  let html = '';

  for (let w = 1; w <= totalWeeks; w++) {
    const start = getWeekStart(state.year, w);
    const end = getWeekEnd(state.year, w);
    const isCurrent = state.year === currentISOYear && w === currentISOWeek;
    const allEntries = getEntriesForWeek(state.year, w);
    const filtered = getFilteredEntries(state.year, w);

    let wPay = 0, wRecv = 0;
    allEntries.forEach(e => { if(e.type==='pay') wPay+=e.value; else wRecv+=e.value; });
    const wBal = wRecv - wPay;

    const shouldOpen = isCurrent || (filtered.length > 0 && w === currentISOWeek);

    html += `<div class="week-block ${isCurrent ? 'active-week' : ''} ${(isCurrent || allEntries.length > 0) ? 'open' : ''}" id="week-${w}" data-week="${w}">
      <div class="week-header" onclick="toggleWeek(${w})">
        <div class="week-title">
          <span>Semana ${w}</span>
          <span class="week-badge ${isCurrent ? 'current' : ''}">${formatDate(start)} – ${formatDate(end)}</span>
          ${isCurrent ? '<span class="week-badge current">ATUAL</span>' : ''}
        </div>
        <div class="week-amounts">
          ${wPay > 0 ? `<span class="w-pay">▼ ${fmtBRL(wPay)}</span>` : ''}
          ${wRecv > 0 ? `<span class="w-recv">▲ ${fmtBRL(wRecv)}</span>` : ''}
          ${(wPay > 0 || wRecv > 0) ? `<span class="w-bal ${wBal >= 0 ? 'pos' : 'neg'}">${wBal >= 0 ? '+' : ''}${fmtBRL(wBal)}</span>` : ''}
        </div>
        <span class="week-chevron">▼</span>
      </div>
      <div class="week-body">
        ${renderWeekEntries(filtered, w)}
        <div class="week-add-row">
          <button class="add-btn pay" onclick="openModal('pay', ${w})">+ Despesa</button>
          <button class="add-btn recv" onclick="openModal('recv', ${w})">+ Receita</button>
        </div>
      </div>
    </div>`;
  }

  container.innerHTML = html;

  // Re-open state
  container.querySelectorAll('.week-block').forEach(block => {
    const w = parseInt(block.dataset.week);
    const isCurrent = state.year === currentISOYear && w === currentISOWeek;
    const hasEntries = getEntriesForWeek(state.year, w).length > 0;
    if (isCurrent || hasEntries) block.classList.add('open');
    else block.classList.remove('open');
  });
}

function renderWeekEntries(entries, week) {
  if (!entries.length) {
    return `<div class="empty-week">Nenhuma conta nesta semana</div>`;
  }

  const pays = entries.filter(e => e.type === 'pay');
  const recvs = entries.filter(e => e.type === 'recv');
  let html = '';

  if (pays.length) {
    html += `<div style="padding:8px 20px 4px;font-size:.72rem;color:var(--red);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);">▼ A Pagar</div>`;
    html += `<div class="entries-list">`;
    pays.forEach(e => { html += renderEntry(e); });
    html += `</div>`;
  }

  if (recvs.length) {
    html += `<div style="padding:8px 20px 4px;font-size:.72rem;color:var(--green);text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);">▲ A Receber</div>`;
    html += `<div class="entries-list">`;
    recvs.forEach(e => { html += renderEntry(e); });
    html += `</div>`;
  }

  return html;
}

function renderEntry(e) {
  const overdue = isOverdue(e);
  const dueLabel = e.dueDate ? `Venc. ${formatDateFull(parseDateStr(e.dueDate))}` : '';
  let recurLabel = '';
  if (e.recurrence === 'fixed') recurLabel = `<span class="entry-fixed">Fixo ${e.recurrencePeriod === 'monthly' ? 'Mensal' : 'Semanal'}</span>`;
  else if (e.recurrence === 'recur') recurLabel = `<span class="entry-recur">Recorrente ${e.recurTimes}× ${e.recurrencePeriod === 'monthly' ? 'Mensal' : 'Semanal'}</span>`;

  return `<div class="entry-item" id="entry-${e.id}">
    <div class="entry-check ${e.paid ? 'checked' : ''} ${e.type === 'pay' ? 'pay-check' : ''}"
         onclick="togglePaid('${e.id}')"></div>
    <div class="entry-info">
      <div class="entry-desc" style="${e.paid ? 'text-decoration:line-through;opacity:.5' : ''}">${e.desc}</div>
      <div class="entry-meta">
        ${dueLabel ? `<span class="${overdue ? 'entry-overdue' : 'entry-due'}">${overdue ? '⚠ ' : ''}${dueLabel}</span>` : ''}
        ${recurLabel}
      </div>
    </div>
    <div class="entry-amount ${e.type}">${fmtBRL(e.value)}</div>
    <div class="entry-actions">
      <button class="entry-btn" onclick="editEntry('${e.id}')" title="Editar">✎</button>
      <button class="entry-btn del" onclick="deleteEntry('${e.id}')" title="Excluir">✕</button>
    </div>
  </div>`;
}

// ─────────────────────────────────────────
// INTERACTIONS
// ─────────────────────────────────────────
function toggleWeek(w) {
  const block = document.getElementById(`week-${w}`);
  if (block) block.classList.toggle('open');
}

function scrollToWeek(w) {
  const block = document.getElementById(`week-${w}`);
  if (block) {
    block.classList.add('open');
    block.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function togglePaid(id) {
  const entry = state.entries.find(e => e.id === id);
  if (entry) {
    entry.paid = !entry.paid;
    saveState();
    render();
    showToast(entry.paid ? '✓ Marcado como pago' : '○ Marcado como pendente');
  }
}

function deleteEntry(id) {
  if (!confirm('Excluir esta conta?')) return;
  state.entries = state.entries.filter(e => e.id !== id);
  saveState();
  render();
  showToast('🗑 Conta excluída');
}

function editEntry(id) {
  const entry = state.entries.find(e => e.id === id);
  if (!entry) return;
  state.editingId = id;
  openModal(entry.type, entry.isoWeek, entry);
}

// ─────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────
let currentModalWeek = null;

function openModal(type, week, editData) {
  state.modalType = type || 'pay';
  currentModalWeek = week || currentISOWeek;
  state.editingId = editData ? editData.id : null;

  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalDot').className = 'dot ' + state.modalType;
  document.getElementById('modalTitle').textContent = state.editingId
    ? (type === 'pay' ? 'Editar Despesa' : 'Editar Receita')
    : (type === 'pay' ? 'Nova Despesa' : 'Nova Receita');

  document.getElementById('btnSubmit').className = 'btn-submit ' + state.modalType;
  document.getElementById('btnSubmit').textContent = state.editingId ? 'Salvar Alterações' : 'Lançar Conta';

  // Type buttons
  document.getElementById('typePayBtn').classList.toggle('active', state.modalType === 'pay');
  document.getElementById('typeRecvBtn').classList.toggle('active', state.modalType === 'recv');

  // Populate week select
  const weekSel = document.getElementById('fWeek');
  const totalWeeks = getWeeksInYear(state.year);
  weekSel.innerHTML = '';
  for (let w = 1; w <= totalWeeks; w++) {
    const start = getWeekStart(state.year, w);
    const end = getWeekEnd(state.year, w);
    const opt = document.createElement('option');
    opt.value = w;
    opt.textContent = `Semana ${w} — ${formatDate(start)} a ${formatDate(end)}`;
    if (w === currentModalWeek) opt.selected = true;
    weekSel.appendChild(opt);
  }

  // Populate fields
  if (editData) {
    document.getElementById('fDesc').value = editData.desc || '';
    document.getElementById('fValue').value = editData.value || '';
    document.getElementById('fDate').value = editData.dueDate || '';
    setRecur(editData.recurrence || 'none');
    if (editData.recurrence === 'fixed') setFixedPeriod(editData.recurrencePeriod || 'monthly');
    if (editData.recurrence === 'recur') {
      setRecurPeriod(editData.recurrencePeriod || 'monthly');
      document.getElementById('fRecurTimes').value = editData.recurTimes || '';
    }
    weekSel.value = editData.isoWeek;
  } else {
    document.getElementById('fDesc').value = '';
    document.getElementById('fValue').value = '';
    document.getElementById('fDate').value = toDateInput(today);
    setRecur('none');
  }

  setTimeout(() => document.getElementById('fDesc').focus(), 100);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  state.editingId = null;
}

function setType(t) {
  state.modalType = t;
  document.getElementById('typePayBtn').classList.toggle('active', t === 'pay');
  document.getElementById('typeRecvBtn').classList.toggle('active', t === 'recv');
  document.getElementById('modalDot').className = 'dot ' + t;
  document.getElementById('modalTitle').textContent = t === 'pay' ? (state.editingId ? 'Editar Despesa' : 'Nova Despesa') : (state.editingId ? 'Editar Receita' : 'Nova Receita');
  document.getElementById('btnSubmit').className = 'btn-submit ' + t;
}

function setRecur(type) {
  state.recurType = type;
  ['None','Fixed','Recur'].forEach(n => {
    document.getElementById(`recur${n}Btn`).classList.remove('active');
  });
  document.getElementById(`recur${type.charAt(0).toUpperCase()}${type.slice(1)}Btn`).classList.add('active');
  document.getElementById('fixedFields').classList.toggle('show', type === 'fixed');
  document.getElementById('recurFields').classList.toggle('show', type === 'recur');
}

function setFixedPeriod(p) {
  state.fixedPeriod = p;
  document.getElementById('fixedMonthBtn').classList.toggle('active', p === 'monthly');
  document.getElementById('fixedWeekBtn').classList.toggle('active', p === 'weekly');
}

function setRecurPeriod(p) {
  state.recurPeriod = p;
  document.getElementById('recurMonthBtn').classList.toggle('active', p === 'monthly');
  document.getElementById('recurWeekBtn').classList.toggle('active', p === 'weekly');
}

function submitEntry() {
  const desc = document.getElementById('fDesc').value.trim();
  const value = parseFloat(document.getElementById('fValue').value);
  const dueDate = document.getElementById('fDate').value;
  const week = parseInt(document.getElementById('fWeek').value);

  if (!desc) { showToast('⚠ Informe a descrição'); document.getElementById('fDesc').focus(); return; }
  if (!value || value <= 0) { showToast('⚠ Informe um valor válido'); document.getElementById('fValue').focus(); return; }
  if (!dueDate) { showToast('⚠ Informe a data de vencimento'); document.getElementById('fDate').focus(); return; }

  const baseEntry = {
    type: state.modalType,
    desc, value, dueDate,
    isoWeek: week,
    isoYear: state.year,
    recurrence: state.recurType,
    recurrencePeriod: state.recurType === 'fixed' ? state.fixedPeriod : state.recurPeriod,
    recurTimes: state.recurType === 'recur' ? parseInt(document.getElementById('fRecurTimes').value) || 1 : null,
    paid: false
  };

  if (state.editingId) {
    const idx = state.entries.findIndex(e => e.id === state.editingId);
    if (idx >= 0) {
      state.entries[idx] = { ...state.entries[idx], ...baseEntry };
    }
    showToast('✓ Conta atualizada');
  } else {
    // Generate occurrences
    if (state.recurType === 'recur') {
      const times = baseEntry.recurTimes || 1;
      const period = baseEntry.recurrencePeriod;
      for (let i = 0; i < times; i++) {
        const occDue = period === 'monthly' ? addMonths(parseDateStr(dueDate), i) : addWeeks(parseDateStr(dueDate), i);
        const occWeek = getISOWeek(occDue);
        const occYear = getISOYear(occDue);
        state.entries.push({
          ...baseEntry,
          id: genId(),
          dueDate: toDateInput(occDue),
          isoWeek: occWeek,
          isoYear: occYear,
          recurIndex: i + 1,
          recurTotal: times
        });
      }
      showToast(`✓ ${times} lançamentos criados`);
    } else {
      state.entries.push({ ...baseEntry, id: genId() });
      showToast('✓ Conta lançada');
    }
  }

  saveState();
  closeModal();
  render();

  // Scroll to week
  setTimeout(() => scrollToWeek(week), 200);
}

// ─────────────────────────────────────────
// YEAR NAV
// ─────────────────────────────────────────
document.getElementById('prevYear').onclick = () => {
  state.year--;
  document.getElementById('yearLabel').textContent = state.year;
  render();
};
document.getElementById('nextYear').onclick = () => {
  state.year++;
  document.getElementById('yearLabel').textContent = state.year;
  render();
};

// ─────────────────────────────────────────
// FAB
// ─────────────────────────────────────────
document.getElementById('fabMain').onclick = () => {
  state.fabOpen = !state.fabOpen;
  document.getElementById('fabMain').classList.toggle('open', state.fabOpen);
  document.getElementById('fabPay').classList.toggle('visible', state.fabOpen);
  document.getElementById('fabRecv').classList.toggle('visible', state.fabOpen);
};

document.getElementById('fabPay').onclick = () => {
  state.fabOpen = false;
  document.getElementById('fabMain').classList.remove('open');
  document.getElementById('fabPay').classList.remove('visible');
  document.getElementById('fabRecv').classList.remove('visible');
  openModal('pay', currentISOWeek);
};

document.getElementById('fabRecv').onclick = () => {
  state.fabOpen = false;
  document.getElementById('fabMain').classList.remove('open');
  document.getElementById('fabPay').classList.remove('visible');
  document.getElementById('fabRecv').classList.remove('visible');
  openModal('recv', currentISOWeek);
};

// Close modal
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').onclick = (e) => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
};

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) {
    submitEntry();
  }
});

// ─────────────────────────────────────────
// FILTERS
// ─────────────────────────────────────────
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.onclick = function() {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    state.activeFilter = this.dataset.filter;
    render();
  };
});

document.getElementById('searchInput').oninput = function() {
  state.searchQuery = this.value.trim();
  render();
};

// ─────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────
let toastTimeout;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 2200);
}

// ─────────────────────────────────────────
// PWA INSTALL
// ─────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

document.getElementById('installBtn').onclick = async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBanner').classList.remove('show');
  }
};

document.getElementById('closeBanner').onclick = () => {
  document.getElementById('installBanner').classList.remove('show');
};

// ─────────────────────────────────────────
// SERVICE WORKER
// ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// ─────────────────────────────────────────
// INIT
// ─────────────────────────────────────────
loadState();
document.getElementById('yearLabel').textContent = state.year;
render();

// Auto-scroll to current week
setTimeout(() => {
  const block = document.getElementById(`week-${currentISOWeek}`);
  if (block && state.year === currentISOYear) {
    block.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  // Scroll chip into view
  const chip = document.querySelector(`.week-chip[data-week="${currentISOWeek}"]`);
  if (chip) chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}, 400);
</script>
</body>
</html>
