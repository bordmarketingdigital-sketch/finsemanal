<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1923">
<meta name="description" content="Controle financeiro semanal - Contas a Pagar e Receber">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinSemanal">
<link rel="manifest" href="manifest.json">
<title>FinSemanal — Controle Financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0b1118; --surface:#121c27; --surface2:#1a2535; --border:#1f3048;
    --accent-neutral:#3d9eff; --text:#e8edf3; --text-muted:#5e7a96; --text-dim:#3a5268;
    --green:#00e5a0; --red:#ff4d6d; --yellow:#ffd166;
    --font-display:'Syne',sans-serif; --font-mono:'Space Mono',monospace;
    --radius:12px; --radius-sm:8px; --shadow:0 8px 32px rgba(0,0,0,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--text);font-family:var(--font-display);min-height:100vh;overflow-x:hidden;}

  /* HEADER */
  header{position:sticky;top:0;z-index:100;background:rgba(11,17,24,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;}
  .logo{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;}
  .logo span{color:var(--green);}
  #currentWeekInfo{font-size:.72rem;color:var(--text-muted);font-family:var(--font-mono);line-height:1.4;text-align:right;}

  /* PAGE TABS */
  .page-tabs{display:flex;border-bottom:1px solid var(--border);background:rgba(11,17,24,.94);backdrop-filter:blur(12px);position:sticky;top:64px;z-index:99;}
  .page-tab{flex:1;padding:14px 8px;text-align:center;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;transition:all .2s;user-select:none;}
  .page-tab.active{color:var(--text);border-bottom-color:var(--accent-neutral);}

  /* PAGES */
  .page{display:none;}.page.active{display:block;}
  .page-inner{max-width:1200px;margin:0 auto;padding:24px 16px 100px;}

  /* NAV BAR */
  .nav-bar{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .year-selector{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;}
  .year-selector button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;padding:0 4px;transition:color .2s;}
  .year-selector button:hover{color:var(--text);}
  .year-selector .year-label{font-weight:700;font-size:1rem;font-family:var(--font-mono);min-width:44px;text-align:center;}
  .week-jump{display:flex;gap:6px;align-items:center;flex:1;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
  .week-jump::-webkit-scrollbar{display:none;}
  .week-chip{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:.75rem;font-family:var(--font-mono);cursor:pointer;transition:all .15s;white-space:nowrap;color:var(--text-muted);}
  .week-chip:hover{border-color:var(--accent-neutral);color:var(--text);}
  .week-chip.current-week{border-color:var(--green);color:var(--green);}
  .week-chip.current-week.hl{background:var(--green);color:#000;border-color:var(--green);font-weight:700;}

  /* SUMMARY CARDS */
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
  @media(max-width:520px){.summary-grid{grid-template-columns:1fr;}}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;position:relative;overflow:hidden;}
  .summary-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;}
  .summary-card.card-pay::before{background:var(--red);}
  .summary-card.card-recv::before{background:var(--green);}
  .summary-card.card-balance::before{background:var(--accent-neutral);}
  .summary-card .label{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:var(--font-mono);}
  .summary-card .amount{font-family:var(--font-mono);font-size:1.35rem;font-weight:700;}
  .summary-card.card-pay .amount{color:var(--red);}
  .summary-card.card-recv .amount{color:var(--green);}
  .summary-card.card-balance .amount{color:var(--accent-neutral);}
  .summary-card .sub{font-size:.7rem;color:var(--text-dim);margin-top:4px;font-family:var(--font-mono);}

  /* WEEK BLOCK */
  /* WEEK NAV */
  .week-nav{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  .week-nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 14px;color:var(--text-muted);cursor:pointer;font-size:1rem;transition:all .15s;flex-shrink:0;}
  .week-nav-btn:hover{border-color:var(--accent-neutral);color:var(--text);}
  .week-nav-btn:disabled{opacity:.3;cursor:default;}
  .week-nav-center{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .week-nav-title{font-family:var(--font-mono);font-weight:700;font-size:.9rem;}
  .week-nav-dates{font-family:var(--font-mono);font-size:.75rem;color:var(--text-muted);}
  .week-current-badge{background:rgba(0,229,160,.15);border:1px solid var(--green);border-radius:6px;padding:2px 8px;font-size:.68rem;color:var(--green);font-family:var(--font-mono);font-weight:700;white-space:nowrap;}

  /* SUMMARY ROW */
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  @media(max-width:520px){.summary-grid{grid-template-columns:1fr;}}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;position:relative;overflow:hidden;}
  .summary-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;}
  .summary-card.card-pay::before{background:var(--red);}
  .summary-card.card-recv::before{background:var(--green);}
  .summary-card.card-balance::before{background:var(--accent-neutral);}
  .summary-card .label{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-family:var(--font-mono);}
  .summary-card .amount{font-family:var(--font-mono);font-size:1.25rem;font-weight:700;}
  .summary-card.card-pay .amount{color:var(--red);}
  .summary-card.card-recv .amount{color:var(--green);}
  .summary-card.card-balance .amount{color:var(--accent-neutral);}
  .summary-card .sub{font-size:.68rem;color:var(--text-dim);margin-top:3px;font-family:var(--font-mono);}

  /* ENTRIES PANEL */
  .entries-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}

  /* ENTRIES */
  .section-label{padding:8px 20px 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);}
  .section-label.pay{color:var(--red);}.section-label.recv{color:var(--green);}
  .entries-list{padding:4px 0;}
  .entry-item{display:flex;align-items:center;gap:12px;padding:9px 20px;border-bottom:1px solid rgba(31,48,72,.4);transition:background .15s;animation:fadeIn .2s ease;}
  .entry-item:hover{background:rgba(255,255,255,.03);}
  .entry-item:last-child{border-bottom:none;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
  .entry-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .entry-check.checked{background:var(--green);border-color:var(--green);}
  .entry-check.checked::after{content:'✓';color:#000;font-size:.65rem;font-weight:700;}
  .entry-check.pay-check.checked{background:var(--red);border-color:var(--red);}
  .entry-info{flex:1;min-width:0;}
  .entry-desc{font-size:.86rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry-meta{font-size:.68rem;color:var(--text-muted);font-family:var(--font-mono);display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;}
  .entry-recur{background:rgba(61,158,255,.1);border-radius:4px;padding:1px 5px;color:var(--accent-neutral);}
  .entry-fixed{background:rgba(255,209,102,.1);border-radius:4px;padding:1px 5px;color:var(--yellow);}
  .entry-overdue{color:var(--red);}
  .entry-amount{font-family:var(--font-mono);font-size:.9rem;font-weight:700;flex-shrink:0;}
  .entry-amount.pay{color:var(--red);}.entry-amount.recv{color:var(--green);}
  .entry-actions{display:flex;gap:4px;}
  .entry-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;border-radius:4px;font-size:.82rem;transition:all .15s;line-height:1;}
  .entry-btn:hover{color:var(--text);background:var(--surface2);}
  .entry-btn.del:hover{color:var(--red);}
  .empty-week{padding:18px 20px;text-align:center;color:var(--text-dim);font-size:.8rem;font-family:var(--font-mono);}
  .week-add-row{display:flex;gap:8px;padding:10px 20px;border-top:1px solid var(--border);}
  .add-btn{flex:1;padding:8px 12px;border:1px dashed;border-radius:var(--radius-sm);background:none;cursor:pointer;font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:all .2s;font-family:var(--font-display);}
  .add-btn.pay{border-color:rgba(255,77,109,.3);color:var(--red);}
  .add-btn.pay:hover{background:rgba(255,77,109,.1);border-color:var(--red);}
  .add-btn.recv{border-color:rgba(0,229,160,.3);color:var(--green);}
  .add-btn.recv:hover{background:rgba(0,229,160,.1);border-color:var(--green);}

  /* FILTER BAR */
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
  .filter-label{font-size:.75rem;color:var(--text-muted);font-family:var(--font-mono);}
  .filter-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.75rem;cursor:pointer;transition:all .15s;color:var(--text-muted);font-family:var(--font-mono);}
  .filter-chip:hover{border-color:var(--accent-neutral);color:var(--text);}
  .filter-chip.active{background:var(--accent-neutral);border-color:var(--accent-neutral);color:#000;font-weight:700;}
  .search-input{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 14px;color:var(--text);font-size:.8rem;outline:none;font-family:var(--font-display);transition:border-color .15s;flex:1;min-width:120px;}
  .search-input:focus{border-color:var(--accent-neutral);}
  .search-input::placeholder{color:var(--text-dim);}

  /* ══ MONTHLY ══ */
  .month-nav{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .month-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .month-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:.78rem;font-family:var(--font-mono);cursor:pointer;transition:all .15s;color:var(--text-muted);white-space:nowrap;}
  .month-chip:hover{border-color:var(--accent-neutral);color:var(--text);}
  .month-chip.active{background:var(--accent-neutral);border-color:var(--accent-neutral);color:#000;font-weight:700;}
  .month-chip.current-month{border-color:var(--green);color:var(--green);}
  .month-chip.current-month.active{background:var(--green);border-color:var(--green);color:#000;}

  .month-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px;}
  @media(max-width:640px){.month-summary{grid-template-columns:repeat(2,1fr);}}
  .ms-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
  .ms-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;}
  .ms-card.ms-pay::before{background:var(--red);}
  .ms-card.ms-recv::before{background:var(--green);}
  .ms-card.ms-bal::before{background:var(--accent-neutral);}
  .ms-card.ms-paid::before{background:var(--yellow);}
  .ms-card .ms-label{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-family:var(--font-mono);}
  .ms-card .ms-val{font-family:var(--font-mono);font-size:1.1rem;font-weight:700;}
  .ms-card.ms-pay .ms-val{color:var(--red);}
  .ms-card.ms-recv .ms-val{color:var(--green);}
  .ms-card.ms-bal .ms-val{color:var(--accent-neutral);}
  .ms-card.ms-paid .ms-val{color:var(--yellow);}

  /* TABLE */
  .table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  thead tr{background:var(--surface2);}
  th{padding:10px 14px;text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-family:var(--font-mono);border-bottom:1px solid var(--border);white-space:nowrap;}
  th.num,td.num{text-align:right;}
  td{padding:10px 14px;border-bottom:1px solid rgba(31,48,72,.5);vertical-align:middle;}
  td.num{font-family:var(--font-mono);font-size:.8rem;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,.02);}
  .type-badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 8px;font-size:.68rem;font-weight:700;font-family:var(--font-mono);}
  .type-badge.pay{background:rgba(255,77,109,.15);color:var(--red);}
  .type-badge.recv{background:rgba(0,229,160,.15);color:var(--green);}
  .status-badge{display:inline-block;border-radius:4px;padding:2px 8px;font-size:.68rem;font-weight:700;font-family:var(--font-mono);}
  .status-badge.paid{background:rgba(0,229,160,.1);color:var(--green);}
  .status-badge.pending{background:rgba(255,209,102,.1);color:var(--yellow);}
  .status-badge.overdue{background:rgba(255,77,109,.1);color:var(--red);}
  .td-desc{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tfoot-row td{background:var(--surface2);font-weight:700;font-family:var(--font-mono);border-top:2px solid var(--border);}
  .table-empty{padding:36px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:.82rem;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--text);}
  th.sort-asc::after{content:' ↑';color:var(--accent-neutral);}
  th.sort-desc::after{content:' ↓';color:var(--accent-neutral);}

  /* FAB */
  .fab-container{position:fixed;bottom:24px;right:20px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:90;}
  .fab-mini{display:flex;align-items:center;gap:8px;padding:10px 16px;border:none;border-radius:24px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:var(--font-display);box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);pointer-events:none;transition:all .2s;}
  .fab-mini.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
  .fab-mini.pay{background:var(--red);color:#fff;}
  .fab-mini.recv{background:var(--green);color:#000;}
  .fab-mini:hover{transform:translateY(-2px) scale(1.03);}
  .fab{width:56px;height:56px;border-radius:50%;background:var(--accent-neutral);border:none;cursor:pointer;font-size:1.5rem;color:#000;box-shadow:0 4px 20px rgba(61,158,255,.4);transition:all .2s;display:flex;align-items:center;justify-content:center;}
  .fab:hover{transform:scale(1.1);}
  .fab.open{transform:rotate(45deg);background:var(--text-muted);box-shadow:none;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:480px;box-shadow:var(--shadow);animation:modalIn .25s ease;max-height:90vh;overflow-y:auto;}
  @keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0;}
  .modal-title{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px;}
  .modal-title .dot{width:10px;height:10px;border-radius:50%;}
  .modal-title .dot.pay{background:var(--red);}.modal-title .dot.recv{background:var(--green);}
  .modal-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.2rem;padding:4px;border-radius:4px;transition:color .15s;}
  .modal-close:hover{color:var(--text);}
  .modal-body{padding:20px 24px 24px;}
  .form-group{margin-bottom:16px;}
  .form-label{display:block;font-size:.73rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:6px;font-family:var(--font-mono);}
  .form-input,.form-select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:.9rem;font-family:var(--font-display);outline:none;transition:border-color .15s;-webkit-appearance:none;}
  .form-input:focus,.form-select:focus{border-color:var(--accent-neutral);}
  .form-select option{background:var(--surface2);}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:420px){.form-row{grid-template-columns:1fr;}}
  .toggle-group{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
  .toggle-opt{flex:1;padding:9px;text-align:center;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text-muted);border:none;background:none;font-family:var(--font-display);}
  .toggle-opt.active{background:var(--accent-neutral);color:#000;}
  .toggle-opt.active.pay-opt{background:var(--red);color:#fff;}
  .toggle-opt.active.recv-opt{background:var(--green);color:#000;}
  .recur-fields{margin-top:12px;display:none;}
  .recur-fields.show{display:block;}
  .btn-submit{width:100%;padding:13px;border:none;border-radius:var(--radius-sm);font-size:.9rem;font-weight:700;cursor:pointer;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.06em;transition:all .15s;margin-top:4px;}
  .btn-submit.pay{background:var(--red);color:#fff;}
  .btn-submit.pay:hover{filter:brightness(1.1);}
  .btn-submit.recv{background:var(--green);color:#000;}
  .btn-submit.recv:hover{filter:brightness(1.1);}

  /* INSTALL BANNER */
  .install-banner{background:linear-gradient(135deg,rgba(61,158,255,.15),rgba(0,229,160,.1));border:1px solid rgba(61,158,255,.3);border-radius:var(--radius);padding:12px 16px;display:none;align-items:center;gap:12px;margin-bottom:20px;font-size:.82rem;}
  .install-banner.show{display:flex;}
  .install-banner button{background:var(--accent-neutral);color:#000;border:none;border-radius:6px;padding:6px 14px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:var(--font-display);}
  .install-banner .ib-close{background:none;color:var(--text-muted);margin-left:auto;}

  /* TOAST */
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:10px 20px;font-size:.82rem;color:var(--text);font-family:var(--font-mono);opacity:0;transition:all .3s;pointer-events:none;z-index:300;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<header>
  <div class="logo">Fin<span>Semanal</span></div>
  <div id="currentWeekInfo"></div>
</header>

<div class="page-tabs">
  <div class="page-tab active" data-page="weekly">📅 Semanal</div>
  <div class="page-tab" data-page="monthly">📊 Mensal</div>
</div>

<!-- PAGE: WEEKLY -->
<div class="page active" id="page-weekly">
  <div class="page-inner">
    <div class="install-banner" id="installBanner">
      <span>📱 Instale o app para acesso rápido</span>
      <button id="installBtn">Instalar</button>
      <button class="ib-close" id="closeBanner">✕</button>
    </div>

    <!-- Navegação de semana -->
    <div class="week-nav">
      <button class="week-nav-btn" id="prevWeekBtn" onclick="changeWeek(-1)">‹</button>
      <div class="week-nav-center">
        <div>
          <div class="week-nav-title" id="weekNavTitle">Semana —</div>
          <div class="week-nav-dates" id="weekNavDates">—</div>
        </div>

</div>

<!-- PAGE: MONTHLY -->
<div class="page" id="page-monthly">
  <div class="page-inner">
    <div class="month-nav">

          — selecione a data de vencimento
        </div>

        <input type="hidden" id="fWeek" value="">

<script>
// ═══════════════════════════════════════
// ISO WEEK UTILS
// ═══════════════════════════════════════
function getISOWeek(d){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+3-(t.getDay()+6)%7);const w=new Date(t.getFullYear(),0,4);return 1+Math.round(((t-w)/86400000-3+(w.getDay()+6)%7)/7);}
function getISOYear(d){const t=new Date(d);t.setDate(t.getDate()+3-(t.getDay()+6)%7);return t.getFullYear();}
function getWeekStart(y,w){const j=new Date(y,0,4),dw=(j.getDay()+6)%7,s=new Date(j);s.setDate(j.getDate()-dw+(w-1)*7);return s;}
function getWeekEnd(y,w){const s=getWeekStart(y,w),e=new Date(s);e.setDate(s.getDate()+6);return e;}
function getWeeksInYear(y){return getISOWeek(new Date(y,11,28));}
function fmtD(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function fmtDFull(d){return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});}
function parseD(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function toInp(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addM(d,n){const t=new Date(d);t.setMonth(t.getMonth()+n);return t;}
function addW(d,n){const t=new Date(d);t.setDate(t.getDate()+n*7);return t;}
function fmtBRL(v){return 'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}

const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const today=new Date();
const CW=getISOWeek(today), CY=getISOYear(today), CM=today.getMonth();

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let S={
  year:CY, yearM:CY, activeMonth:CM,
  selectedWeek:CW,          // semana visível no dash
  filter:'all', mfilter:'all',
  search:'', searchM:'',
  fabOpen:false, editId:null,
  mType:'pay', rType:'none', fixPeriod:'monthly', rPeriod:'monthly',
  sortCol:'date', sortDir:'asc',
  entries:[]
};

function load(){try{const s=localStorage.getItem('fs_v2');if(s)S.entries=JSON.parse(s);}catch(e){}}
function save(){localStorage.setItem('fs_v2',JSON.stringify(S.entries));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5);}
function isOver(e){if(e.paid)return false;const d=parseD(e.dueDate);return d&&d<today;}

let currentPage='weekly';

// ═══════════════════════════════════════
// PAGE SWITCHING
// ═══════════════════════════════════════
document.querySelectorAll('.page-tab').forEach(tab=>{
  tab.onclick=function(){
    currentPage=this.dataset.page;
    document.querySelectorAll('.page-tab').forEach(t=>t.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+currentPage).classList.add('active');
    if(currentPage==='monthly') renderMonthly();
  };
});

// ═══════════════════════════════════════
// WEEKLY — visão de semana única
// ═══════════════════════════════════════
function render(){
  renderWeekNav();
  renderSummary();
  renderWeekPanel();
  const s=getWeekStart(CY,CW), e=getWeekEnd(CY,CW);
  document.getElementById('currentWeekInfo').innerHTML=`Sem. ${CW} · ${fmtD(s)}–${fmtD(e)}`;
}

function changeWeek(delta){
  const total=getWeeksInYear(S.year);
  let nw=S.selectedWeek+delta;
  if(nw<1){
    // vai para o ano anterior
    S.year--; document.getElementById('yearLabel')&&(document.getElementById('yearLabel').textContent=S.year);
    nw=getWeeksInYear(S.year);
  } else if(nw>total){
    // vai para o próximo ano
    S.year++; document.getElementById('yearLabel')&&(document.getElementById('yearLabel').textContent=S.year);
    nw=1;
  }
  S.selectedWeek=nw;
  render();
}

function renderWeekNav(){
  const w=S.selectedWeek, y=S.year;
  const ws=getWeekStart(y,w), we=getWeekEnd(y,w);
  const isCurrent=y===CY&&w===CW;
  document.getElementById('weekNavTitle').textContent=`Semana ${w} · ${y}`;
  document.getElementById('weekNavDates').textContent=`${fmtD(ws)} – ${fmtD(we)}`;
  document.getElementById('weekCurrentBadge').style.display=isCurrent?'':'none';
}

function filtered(year,week){
  let e=S.entries.filter(x=>x.isoYear===year&&x.isoWeek===week);
  if(S.filter==='pay') e=e.filter(x=>x.type==='pay');
  else if(S.filter==='recv') e=e.filter(x=>x.type==='recv');
  else if(S.filter==='pending') e=e.filter(x=>!x.paid);
  else if(S.filter==='overdue') e=e.filter(x=>isOver(x));
  if(S.search){const q=S.search.toLowerCase();e=e.filter(x=>x.desc.toLowerCase().includes(q));}
  return e;
}

function renderSummary(){
  // apenas da semana selecionada
  const all=S.entries.filter(e=>e.isoYear===S.year&&e.isoWeek===S.selectedWeek);
  let tp=0,tr=0,cp=0,cr=0;
  all.forEach(e=>{if(e.type==='pay'){tp+=e.value;cp++;}else{tr+=e.value;cr++;}});
  const b=tr-tp;
  document.getElementById('summaryPay').textContent=fmtBRL(tp);
  document.getElementById('summaryRecv').textContent=fmtBRL(tr);
  document.getElementById('summaryBal').textContent=fmtBRL(b);
  document.getElementById('summaryBal').style.color=b>=0?'var(--green)':'var(--red)';
  document.getElementById('summaryPayCount').textContent=`${cp} conta${cp!==1?'s':''}`;
  document.getElementById('summaryRecvCount').textContent=`${cr} conta${cr!==1?'s':''}`;
  document.getElementById('summaryPeriod').textContent='esta semana';
}

function renderWeekPanel(){
  const w=S.selectedWeek, y=S.year;
  const fl=filtered(y,w);
  const panel=document.getElementById('weekPanel');
  const pays=fl.filter(e=>e.type==='pay'), recvs=fl.filter(e=>e.type==='recv');
  let h='';
  if(!fl.length){
    h=`<div style="padding:32px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:.82rem;">Nenhuma conta esta semana</div>`;
  } else {
    if(pays.length){
      h+=`<div class="section-label pay" style="padding:10px 20px 4px">▼ A Pagar</div><div class="entries-list">`;
      pays.forEach(e=>{h+=renderE(e);}); h+=`</div>`;
    }
    if(recvs.length){
      h+=`<div class="section-label recv" style="padding:10px 20px 4px">▲ A Receber</div><div class="entries-list">`;
      recvs.forEach(e=>{h+=renderE(e);}); h+=`</div>`;
    }
  }
  h+=`<div class="week-add-row">
    <button class="add-btn pay" onclick="openModal('pay',${w})">+ Despesa</button>
    <button class="add-btn recv" onclick="openModal('recv',${w})">+ Receita</button>
  </div>`;
  panel.innerHTML=h;
}

function renderWEntries(entries){
  if(!entries.length) return `<div class="empty-week">Nenhuma conta nesta semana</div>`;
  const pays=entries.filter(e=>e.type==='pay'), recvs=entries.filter(e=>e.type==='recv');
  let h='';
  if(pays.length){h+=`<div class="section-label pay">▼ A Pagar</div><div class="entries-list">`;pays.forEach(e=>{h+=renderE(e);});h+=`</div>`;}
  if(recvs.length){h+=`<div class="section-label recv">▲ A Receber</div><div class="entries-list">`;recvs.forEach(e=>{h+=renderE(e);});h+=`</div>`;}
  return h;
}

function renderE(e){
  const ov=isOver(e);
  const due=e.dueDate?`Venc. ${fmtDFull(parseD(e.dueDate))}`:'';
  let rl='';
  if(e.recurrence==='fixed') rl=`<span class="entry-fixed">Fixo ${e.recurrencePeriod==='monthly'?'Mensal':'Semanal'}</span>`;
  else if(e.recurrence==='recur') rl=`<span class="entry-recur">${e.recurIndex||1}/${e.recurTotal||e.recurTimes}× ${e.recurrencePeriod==='monthly'?'Mensal':'Semanal'}</span>`;
  return `<div class="entry-item">
    <div class="entry-check ${e.paid?'checked':''} ${e.type==='pay'?'pay-check':''}" onclick="togglePaid('${e.id}')"></div>
    <div class="entry-info">
      <div class="entry-desc" style="${e.paid?'text-decoration:line-through;opacity:.45':''}">${e.desc}</div>
      <div class="entry-meta">
        ${due?`<span class="${ov?'entry-overdue':''}">${ov?'⚠ ':''}${due}</span>`:''}
        ${rl}
      </div>
    </div>
    <div class="entry-amount ${e.type}">${fmtBRL(e.value)}</div>
    <div class="entry-actions">
      <button class="entry-btn" onclick="editEntry('${e.id}')">✎</button>
      <button class="entry-btn del" onclick="deleteEntry('${e.id}')">✕</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════
// MONTHLY
// ═══════════════════════════════════════
function renderMonthly(){
  renderMonthChips(); renderMonthSummary(); renderMonthTable();
}

function renderMonthChips(){
  document.getElementById('yearLabelM').textContent=S.yearM;
  const c=document.getElementById('monthChips');
  let h='';
  MONTHS.forEach((m,i)=>{
    const ic=S.yearM===CY&&i===CM, ia=i===S.activeMonth;
    h+=`<button class="month-chip ${ic?'current-month':''} ${ia?'active':''}" data-month="${i}">${m.substring(0,3)}</button>`;
  });
  c.innerHTML=h;
  c.querySelectorAll('.month-chip').forEach(b=>{
    b.onclick=function(){ S.activeMonth=parseInt(this.dataset.month); renderMonthly(); };
  });
}

function getMonthAll(){
  return S.entries.filter(e=>{
    if(!e.dueDate) return false;
    const d=parseD(e.dueDate);
    return d.getFullYear()===S.yearM && d.getMonth()===S.activeMonth;
  });
}

function getMonthFiltered(){
  let e=getMonthAll();
  if(S.mfilter==='pay') e=e.filter(x=>x.type==='pay');
  else if(S.mfilter==='recv') e=e.filter(x=>x.type==='recv');
  else if(S.mfilter==='pending') e=e.filter(x=>!x.paid);
  else if(S.mfilter==='paid') e=e.filter(x=>x.paid);
  if(S.searchM){const q=S.searchM.toLowerCase();e=e.filter(x=>x.desc.toLowerCase().includes(q));}
  e.sort((a,b)=>{
    let va,vb;
    if(S.sortCol==='date'){va=a.dueDate||'';vb=b.dueDate||'';}
    else if(S.sortCol==='desc'){va=a.desc.toLowerCase();vb=b.desc.toLowerCase();}
    else if(S.sortCol==='value'){va=a.value;vb=b.value;}
    else if(S.sortCol==='type'){va=a.type;vb=b.type;}
    else if(S.sortCol==='status'){va=a.paid?1:0;vb=b.paid?1:0;}
    if(va<vb) return S.sortDir==='asc'?-1:1;
    if(va>vb) return S.sortDir==='asc'?1:-1;
    return 0;
  });
  return e;
}

function renderMonthSummary(){
  const all=getMonthAll();
  let tp=0,tr=0,tpaid=0;
  all.forEach(e=>{if(e.type==='pay')tp+=e.value;else tr+=e.value;if(e.paid)tpaid+=e.value;});
  const b=tr-tp;
  document.getElementById('monthSummary').innerHTML=`
    <div class="ms-card ms-pay"><div class="ms-label">▼ A Pagar</div><div class="ms-val">${fmtBRL(tp)}</div></div>
    <div class="ms-card ms-recv"><div class="ms-label">▲ A Receber</div><div class="ms-val">${fmtBRL(tr)}</div></div>
    <div class="ms-card ms-bal"><div class="ms-label">= Saldo</div><div class="ms-val" style="color:${b>=0?'var(--green)':'var(--red)'}">${fmtBRL(b)}</div></div>
    <div class="ms-card ms-paid"><div class="ms-label">✓ Quitados</div><div class="ms-val">${fmtBRL(tpaid)}</div></div>`;
}

function sIcon(col){ return S.sortCol===col?(S.sortDir==='asc'?' ↑':' ↓'):''; }
function thS(col,lbl){
  const cls=S.sortCol===col?(S.sortDir==='asc'?'sort-asc':'sort-desc'):'';
  return `<th class="sortable ${cls}" onclick="setSort('${col}')">${lbl}${sIcon(col)}</th>`;
}

function renderMonthTable(){
  const entries=getMonthFiltered(), wrap=document.getElementById('monthTable');
  if(!entries.length){
    wrap.innerHTML=`<div class="table-empty">Nenhuma conta em ${MONTHS[S.activeMonth]} ${S.yearM}</div>`;
    return;
  }
  let tp=0,tr=0; entries.forEach(e=>{if(e.type==='pay')tp+=e.value;else tr+=e.value;});
  let rows='';
  entries.forEach(e=>{
    const ov=isOver(e);
    const st=e.paid?`<span class="status-badge paid">✓ Pago</span>`:ov?`<span class="status-badge overdue">⚠ Vencido</span>`:`<span class="status-badge pending">Pendente</span>`;
    let rl='';
    if(e.recurrence==='fixed') rl=`<span class="entry-fixed" style="font-size:.66rem">Fixo</span>`;
    else if(e.recurrence==='recur') rl=`<span class="entry-recur" style="font-size:.66rem">${e.recurIndex||1}/${e.recurTotal||e.recurTimes}</span>`;
    rows+=`<tr>
      <td><span class="type-badge ${e.type}">${e.type==='pay'?'▼ Pagar':'▲ Receber'}</span></td>
      <td class="td-desc" title="${e.desc}">${e.desc} ${rl}</td>
      <td style="white-space:nowrap">${e.dueDate?fmtDFull(parseD(e.dueDate)):'-'}</td>
      <td class="num" style="color:${e.type==='pay'?'var(--red)':'var(--green)'}">${fmtBRL(e.value)}</td>
      <td style="font-family:var(--font-mono);font-size:.75rem;color:var(--text-muted)">Sem ${e.isoWeek}</td>
      <td>${st}</td>
      <td><div style="display:flex;gap:4px">
        <button class="entry-btn" onclick="togglePaid('${e.id}')" title="${e.paid?'Desmarcar':'Marcar pago'}">${e.paid?'○':'✓'}</button>
        <button class="entry-btn" onclick="editEntry('${e.id}')">✎</button>
        <button class="entry-btn del" onclick="deleteEntry('${e.id}')">✕</button>
      </div></td>
    </tr>`;
  });
  wrap.innerHTML=`<table>
    <thead><tr>
      ${thS('type','Tipo')}
      ${thS('desc','Descrição')}
      ${thS('date','Vencimento')}
      <th class="num sortable ${S.sortCol==='value'?(S.sortDir==='asc'?'sort-asc':'sort-desc'):''}" onclick="setSort('value')">Valor${sIcon('value')}</th>
      <th>Semana</th>
      ${thS('status','Status')}
      <th>Ações</th>
    </tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr class="tfoot-row">
      <td colspan="3" style="font-size:.75rem;color:var(--text-muted)">${entries.length} lançamento${entries.length!==1?'s':''}</td>
      <td class="num"><div style="color:var(--red);font-size:.72rem">▼ ${fmtBRL(tp)}</div><div style="color:var(--green);font-size:.72rem">▲ ${fmtBRL(tr)}</div></td>
      <td colspan="3" style="color:${tr-tp>=0?'var(--green)':'var(--red)'}">Saldo: ${fmtBRL(tr-tp)}</td>
    </tr></tfoot>
  </table>`;
}

function setSort(col){
  if(S.sortCol===col) S.sortDir=S.sortDir==='asc'?'desc':'asc';
  else{S.sortCol=col;S.sortDir='asc';}
  renderMonthTable();
}

document.getElementById('prevYearM').onclick=()=>{S.yearM--;renderMonthly();};
document.getElementById('nextYearM').onclick=()=>{S.yearM++;renderMonthly();};

document.querySelectorAll('[data-mfilter]').forEach(c=>{
  c.onclick=function(){
    document.querySelectorAll('[data-mfilter]').forEach(x=>x.classList.remove('active'));
    this.classList.add('active'); S.mfilter=this.dataset.mfilter;
    renderMonthSummary(); renderMonthTable();
  };
});
document.getElementById('searchMonthly').oninput=function(){S.searchM=this.value.trim();renderMonthTable();};

// ═══════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════
function scrollToWeek(w){
  // após salvar, navega para a semana da conta lançada
  S.selectedWeek=w; render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function togglePaid(id){
  const e=S.entries.find(x=>x.id===id);
  if(e){e.paid=!e.paid;save();render();if(currentPage==='monthly')renderMonthly();showToast(e.paid?'✓ Marcado como pago':'○ Desmarcado');}
}

function deleteEntry(id){
  if(!confirm('Excluir esta conta?'))return;
  S.entries=S.entries.filter(e=>e.id!==id);
  save();render();if(currentPage==='monthly')renderMonthly();showToast('🗑 Excluído');
}

function editEntry(id){
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  S.editId=id; openModal(e.type,e.isoWeek,e);
}

// ═══════════════════════════════════════
// MODAL
// ═══════════════════════════════════════
// Atualiza o preview de semana com base na data digitada
function updateWeekPreview(dateStr){
  const preview=document.getElementById('weekPreview');
  const hidden=document.getElementById('fWeek');
  if(!dateStr){ preview.innerHTML='— selecione a data de vencimento'; hidden.value=''; return; }
  const d=parseD(dateStr);
  const w=getISOWeek(d), y=getISOYear(d);
  const ws=getWeekStart(y,w), we=getWeekEnd(y,w);
  preview.innerHTML=`<span style="color:var(--accent-neutral);font-weight:700">Semana ${w}</span> · ${fmtD(ws)} a ${fmtD(we)} · ${y}`;
  hidden.value=w;
  // atualiza o ano do state se a data for de outro ano
  if(y!==S.year){ S.year=y; document.getElementById('yearLabel').textContent=S.year; }
}

function openModal(type,week,ed){
  S.mType=type||'pay'; S.editId=ed?ed.id:null;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalDot').className='dot '+S.mType;
  document.getElementById('modalTitle').textContent=S.editId?(type==='pay'?'Editar Despesa':'Editar Receita'):(type==='pay'?'Nova Despesa':'Nova Receita');
  document.getElementById('btnSubmit').className='btn-submit '+S.mType;
  document.getElementById('btnSubmit').textContent=S.editId?'Salvar Alterações':'Lançar Conta';
  document.getElementById('typePayBtn').classList.toggle('active',S.mType==='pay');
  document.getElementById('typeRecvBtn').classList.toggle('active',S.mType==='recv');

  if(ed){
    document.getElementById('fDesc').value=ed.desc||'';
    document.getElementById('fValue').value=ed.value||'';
    document.getElementById('fDate').value=ed.dueDate||'';
    setRecur(ed.recurrence||'none');
    if(ed.recurrence==='fixed') setFixedPeriod(ed.recurrencePeriod||'monthly');
    if(ed.recurrence==='recur'){setRecurPeriod(ed.recurrencePeriod||'monthly');document.getElementById('fRecurTimes').value=ed.recurTimes||'';}
    updateWeekPreview(ed.dueDate||'');
  } else {
    document.getElementById('fDesc').value='';
    document.getElementById('fValue').value='';
    document.getElementById('fDate').value=toInp(today);
    setRecur('none');
    updateWeekPreview(toInp(today));
  }
  setTimeout(()=>document.getElementById('fDesc').focus(),100);
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');S.editId=null;}

function setType(t){
  S.mType=t;
  document.getElementById('typePayBtn').classList.toggle('active',t==='pay');
  document.getElementById('typeRecvBtn').classList.toggle('active',t==='recv');
  document.getElementById('modalDot').className='dot '+t;
  document.getElementById('modalTitle').textContent=t==='pay'?(S.editId?'Editar Despesa':'Nova Despesa'):(S.editId?'Editar Receita':'Nova Receita');
  document.getElementById('btnSubmit').className='btn-submit '+t;
}

function setRecur(t){
  S.rType=t;
  ['None','Fixed','Recur'].forEach(n=>document.getElementById(`recur${n}Btn`).classList.remove('active'));
  document.getElementById(`recur${t.charAt(0).toUpperCase()+t.slice(1)}Btn`).classList.add('active');
  document.getElementById('fixedFields').classList.toggle('show',t==='fixed');
  document.getElementById('recurFields').classList.toggle('show',t==='recur');
}

function setFixedPeriod(p){
  S.fixPeriod=p;
  document.getElementById('fixedMonthBtn').classList.toggle('active',p==='monthly');
  document.getElementById('fixedWeekBtn').classList.toggle('active',p==='weekly');
}

function setRecurPeriod(p){
  S.rPeriod=p;
  document.getElementById('recurMonthBtn').classList.toggle('active',p==='monthly');
  document.getElementById('recurWeekBtn').classList.toggle('active',p==='weekly');
}

function submitEntry(){
  const desc=document.getElementById('fDesc').value.trim();
  const value=parseFloat(document.getElementById('fValue').value);
  const dueDate=document.getElementById('fDate').value;
  if(!desc){showToast('⚠ Informe a descrição');document.getElementById('fDesc').focus();return;}
  if(!value||value<=0){showToast('⚠ Informe um valor válido');document.getElementById('fValue').focus();return;}
  if(!dueDate){showToast('⚠ Informe o vencimento');document.getElementById('fDate').focus();return;}

  // semana e ano calculados automaticamente a partir da data de vencimento
  const dueD=parseD(dueDate);
  const week=getISOWeek(dueD);
  const isoYear=getISOYear(dueD);

  const base={type:S.mType,desc,value,dueDate,isoWeek:week,isoYear,
    recurrence:S.rType,
    recurrencePeriod:S.rType==='fixed'?S.fixPeriod:S.rPeriod,
    recurTimes:S.rType==='recur'?parseInt(document.getElementById('fRecurTimes').value)||1:null,
    paid:false};

  if(S.editId){
    const i=S.entries.findIndex(e=>e.id===S.editId);
    if(i>=0) S.entries[i]={...S.entries[i],...base};
    showToast('✓ Conta atualizada');
  } else {
    if(S.rType==='recur'){
      const times=base.recurTimes||1,per=base.recurrencePeriod;
      for(let i=0;i<times;i++){
        const occ=per==='monthly'?addM(parseD(dueDate),i):addW(parseD(dueDate),i);
        S.entries.push({...base,id:uid(),dueDate:toInp(occ),isoWeek:getISOWeek(occ),isoYear:getISOYear(occ),recurIndex:i+1,recurTotal:times});
      }
      showToast(`✓ ${times} lançamentos criados`);
    } else {
      S.entries.push({...base,id:uid()});
      showToast('✓ Conta lançada');
    }
  }

  // navega para a semana da conta lançada
  if(S.year!==isoYear) S.year=isoYear;
  save();closeModal();render();
  if(currentPage==='monthly') renderMonthly();
  setTimeout(()=>scrollToWeek(week),200);
}

// ═══════════════════════════════════════
// FAB
// ═══════════════════════════════════════
document.getElementById('fabMain').onclick=()=>{
  S.fabOpen=!S.fabOpen;
  document.getElementById('fabMain').classList.toggle('open',S.fabOpen);
  document.getElementById('fabPay').classList.toggle('visible',S.fabOpen);
  document.getElementById('fabRecv').classList.toggle('visible',S.fabOpen);
};
document.getElementById('fabPay').onclick=()=>{S.fabOpen=false;['fabMain','fabPay','fabRecv'].forEach(x=>{const el=document.getElementById(x);el.classList.remove('open','visible');});openModal('pay',CW);};
document.getElementById('fabRecv').onclick=()=>{S.fabOpen=false;['fabMain','fabPay','fabRecv'].forEach(x=>{const el=document.getElementById(x);el.classList.remove('open','visible');});openModal('recv',CW);};
// Atualiza semana automaticamente ao mudar a data de vencimento
document.getElementById('fDate').addEventListener('change', function(){ updateWeekPreview(this.value); });

document.getElementById('modalClose').onclick=closeModal;
document.getElementById('modalOverlay').onclick=e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&document.getElementById('modalOverlay').classList.contains('open'))submitEntry();});

// ═══════════════════════════════════════
// FILTERS WEEKLY
// ═══════════════════════════════════════
document.querySelectorAll('[data-filter]').forEach(c=>{
  c.onclick=function(){
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');S.filter=this.dataset.filter;render();
  };
});
document.getElementById('searchInput').oninput=function(){S.search=this.value.trim();render();};

// ═══════════════════════════════════════
// TOAST
// ═══════════════════════════════════════
let toastT;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

// ═══════════════════════════════════════
// PWA

let dp;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('installBanner').classList.add('show');});
document.getElementById('installBtn').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;document.getElementById('installBanner').classList.remove('show');}};
document.getElementById('closeBanner').onclick=()=>document.getElementById('installBanner').classList.remove('show');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

load();
render();
</script>
